name: Dot
options:
  bundleIdPrefix: com.jamielesouef
  deploymentTarget:
    macOS: "26.0"
  defaultSourceDirectoryType: syncedFolder
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.2"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  DotKit:
    path: Modules/DotKit
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0
targets:
  Dot:
    type: application
    platform: macOS
    sources:
      - path: src
        excludes:
          - Info.plist
          - Dot.entitlements
      - path: Icon
    dependencies:
      - package: DotKit
        product: DotCore
      - package: DotKit
        product: DotDesign
      - package: Firebase
        product: FirebaseAnalytics
    entitlements:
      path: src/Dot.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true
    info:
      path: src/Info.plist
      properties:
        CFBundleDisplayName: Dot
        CFBundleName: Dot
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 Jamie Le Souef"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamielesouef.Opal
        PRODUCT_NAME: Dot
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: J2VZJQ63FQ
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  DotTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamielesouef.DotTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
  DotUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: uitests
    dependencies:
      - target: Dot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamielesouef.DotUITests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        TEST_TARGET_NAME: Dot
        ENABLE_APP_SANDBOX: NO
schemes:
  Dot UI Tests:
    build:
      targets:
        Dot: all
        DotUITests: [test]
    test:
      config: Debug
      targets:
        - DotUITests
      preActions:
        - name: Copy the fixture Pack into Dot's container
          settingsTarget: DotUITests
          script: |
            RUN="$HOME/Library/Containers/com.jamielesouef.Opal/Data/tmp/dot-uitest"
            rm -rf "$RUN"
            for name in wide nested; do
              mkdir -p "$RUN/$name/Index"
              ditto "$SRCROOT/Modules/DotKit/Tests/DotCoreTests/Fixtures/Packs/Garden" "$RUN/$name/Garden"
            done
            NESTED="$RUN/nested/Garden/Projects/Dot/Planning/Quarterly Reviews/2026"
            mkdir -p "$NESTED"
            printf -- '---\ntags:\n  - planning\n---\n# Working Notes\n\n## To-Do\n\n- [ ] Plan the next milestone\n\n## Notes\n\nA made-up Note with a long path.\n' > "$NESTED/Working Notes For The Whole Team.md"
      postActions:
        - name: Remove the fixture Pack copies
          settingsTarget: DotUITests
          script: rm -rf "$HOME/Library/Containers/com.jamielesouef.Opal/Data/tmp/dot-uitest"
  Dot:
    build:
      targets:
        Dot: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: DotKit/DotCoreTests
        - package: DotKit/DotDesignTests
        - DotTests
  Dot Release:
    build:
      targets:
        Dot: all
    run:
      config: Release
      debugEnabled: false
      disableMainThreadChecker: true
    profile:
      config: Release
    archive:
      config: Release
