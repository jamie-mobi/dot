name: Opal
options:
  bundleIdPrefix: com.jamielesouef
  deploymentTarget:
    macOS: "26.0"
  defaultSourceDirectoryType: syncedFolder
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  OpalKit:
    path: Modules/OpalKit
targets:
  Opal:
    type: application
    platform: macOS
    sources:
      - path: src
        excludes:
          - Info.plist
          - Opal.entitlements
      - path: Icon
    dependencies:
      - package: OpalKit
        product: OpalCore
      - package: OpalKit
        product: OpalDesign
    entitlements:
      path: src/Opal.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    info:
      path: src/Info.plist
      properties:
        CFBundleDisplayName: Opal
        CFBundleName: Opal
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 Jamie Le Souef"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamielesouef.Opal
        PRODUCT_NAME: Opal
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: J2VZJQ63FQ
          OTHER_CODE_SIGN_FLAGS: --timestamp
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  OpalTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamielesouef.OpalTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
  OpalUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: uitests
    dependencies:
      - target: Opal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamielesouef.OpalUITests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        TEST_TARGET_NAME: Opal
        ENABLE_APP_SANDBOX: NO
schemes:
  Opal UI Tests:
    build:
      targets:
        Opal: all
        OpalUITests: [test]
    test:
      config: Debug
      targets:
        - OpalUITests
      preActions:
        - name: Copy the fixture Vault into Opal's container
          settingsTarget: OpalUITests
          script: |
            RUN="$HOME/Library/Containers/com.jamielesouef.Opal/Data/tmp/opal-uitest"
            rm -rf "$RUN"
            for name in wide nested; do
              mkdir -p "$RUN/$name/Index"
              ditto "$SRCROOT/Modules/OpalKit/Tests/OpalCoreTests/Fixtures/Vaults/Garden" "$RUN/$name/Garden"
            done
            NESTED="$RUN/nested/Garden/Projects/Opal/Planning/Quarterly Reviews/2026"
            mkdir -p "$NESTED"
            printf -- '---\ntags:\n  - planning\n---\n# Working Notes\n\n## To-Do\n\n- [ ] Plan the next milestone\n\n## Notes\n\nA made-up Note with a long path.\n' > "$NESTED/Working Notes For The Whole Team.md"
      postActions:
        - name: Remove the fixture Vault copies
          settingsTarget: OpalUITests
          script: rm -rf "$HOME/Library/Containers/com.jamielesouef.Opal/Data/tmp/opal-uitest"
  Opal:
    build:
      targets:
        Opal: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: OpalKit/OpalCoreTests
        - package: OpalKit/OpalDesignTests
        - OpalTests
  Opal Release:
    build:
      targets:
        Opal: all
    run:
      config: Release
      debugEnabled: false
      disableMainThreadChecker: true
    profile:
      config: Release
    archive:
      config: Release
