name: Opal
options:
  bundleIdPrefix: com.jamielesouef
  deploymentTarget:
    macOS: "26.0"
  defaultSourceDirectoryType: syncedFolder
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  OpalKit:
    path: Modules/OpalKit
targets:
  Opal:
    type: application
    platform: macOS
    sources:
      - path: src
        excludes:
          - Info.plist
          - Opal.entitlements
      - path: Icon
    dependencies:
      - package: OpalKit
        product: OpalCore
      - package: OpalKit
        product: OpalDesign
    entitlements:
      path: src/Opal.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    info:
      path: src/Info.plist
      properties:
        CFBundleDisplayName: Opal
        CFBundleName: Opal
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: "© 2026 Jamie Le Souef"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamielesouef.Opal
        PRODUCT_NAME: Opal
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  OpalTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jamielesouef.OpalTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
schemes:
  Opal:
    build:
      targets:
        Opal: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: OpalKit/OpalCoreTests
        - package: OpalKit/OpalDesignTests
        - OpalTests
  Opal Release:
    build:
      targets:
        Opal: all
    run:
      config: Release
      debugEnabled: false
      disableMainThreadChecker: true
    profile:
      config: Release
    archive:
      config: Release
